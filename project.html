<!DOCTYPE html>

  <script>
    try {
      if (localStorage.getItem("portfolio-theme") === "light") {
        document.documentElement.dataset.theme = "light";
      }
    } catch {
      // Keep the default dark theme when browser storage is unavailable.
    }
  </script>

<body data-page="project">
